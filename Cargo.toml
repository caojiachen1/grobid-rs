[package]
name = "grobid-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
jni = { version = "0.21", features = ["invocation"] }
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive"] }

[features]
cli = []

[build-dependencies]
java-locator = "0.1.9"
dotenv = "0.15"
reqwest = { version = "0.12", features = ["blocking"] }
zip = "2.1"
fs_extra = "1.3"

[[bin]]
name = "grobid-cli"
path = "src/bin/cli.rs"
required-features = ["cli"] 