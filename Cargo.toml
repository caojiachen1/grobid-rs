[package]
name = "grobid-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
jni = { version = "0.21", features = ["invocation"] }
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive"], optional = true }
rayon = { version = "1.10.0", optional = true }
quick-xml = { version = "0.28", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
indicatif = { version = "0.17", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
sha2 = "0.10"
hex = "0.4"
tempfile = "3.10"
directories = "5.0"
fs2 = "0.4"
memmap2 = "0.9"
regex = "1.10.2"
insta = { version = "1.36", features = ["redactions", "filters", "json"], optional = true }
similar-asserts = { version = "1.5", optional = true }

[features]
default = ["cache", "format"]
cache = []
format = ["quick-xml", "serde", "serde_json"]
cli = ["clap", "format", "indicatif", "tracing-subscriber"]
parallel = ["rayon"]

[build-dependencies]
java-locator = "0.1.9"
dotenv = "0.15"
reqwest = { version = "0.12", features = ["blocking"] }
zip = "2.1"
fs_extra = "1.3"
indicatif = "0.17"
anyhow = "1.0"
sha2 = "0.10"
rayon = "1.10.0"
bytes = "1.10"
zstd = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
insta = { version = "1.36", features = ["redactions", "filters", "json"] }
similar-asserts = "1.5"
tempfile = "3.10"
serial_test = "2.0"
tracing-subscriber = "0.3"

[[bin]]
name = "grobid-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]
