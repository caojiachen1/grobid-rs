name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  JAVA_HOME: ${{ runner.os == 'Windows' && 'C:\\Program Files\\Java\\adopt-openjdk-11.0.11+9' || '/usr/lib/jvm/java-11-openjdk-amd64' }}

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Get all history to enable proper version determination

      - name: Install Java (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Install Java (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk

      - name: Install Java (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install openjdk@11

      - name: Set up Rust cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Build
        run: cargo build --verbose --all-features

      - name: Test
        run: cargo test --verbose --all-features

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # Canary job runs the CLI on a test PDF to verify end-to-end functionality
  canary:
    name: Canary - Process Test PDF
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v3
        
      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk
        
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      
      - name: Build CLI
        run: cargo build --features cli
        
      - name: Run on sample PDF
        run: cargo run --features cli -- header tests/assets/sample.pdf