name: build
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  GROBID_VERSION: '0.8.2'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest   # linux‑x64
            target: x86_64-unknown-linux-gnu
          - os: macos-14       # macOS arm64
            target: aarch64-apple-darwin
          - os: windows-latest # win‑x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Install toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      # Set up Java JDK
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          
      # Create vendor directory
      - name: Create vendor directories
        run: mkdir -p vendor/grobid

      # Build crate (it will use the vendored files automatically)
      - name: cargo build
        run: cargo build --release --target ${{ matrix.target }} --features cli

      # Run integration test (parse sample.pdf)
      - name: Test end‑to‑end
        run: cargo test --target ${{ matrix.target }}