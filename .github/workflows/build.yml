name: build
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  GROBID_VERSION: '0.8.2'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest   # linux‑x64
            target: x86_64-unknown-linux-gnu
          - os: macos-14       # macOS arm64
            target: aarch64-apple-darwin
          - os: windows-latest # win‑x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Install toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache JRE runtime by platform
      - name: Cache JRE runtime
        id: jre-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vendor/jre/${{ matrix.os }}
          key: jre-${{ runner.os }}-${{ matrix.target }}-0.8.2

      # Prepare directory for JRE
      - name: Prepare JRE directory
        if: steps.jre-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Clean up any existing directory
          rm -rf vendor/jre || true
          mkdir -p vendor

      # Build minimal JRE via jlink only if not in cache
      - name: Build jlink image
        if: steps.jre-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Build a fresh JRE
          jlink \
            --add-modules java.base,java.logging,java.xml,jdk.unsupported \
            --strip-debug --no-header-files --no-man-pages --compress=2 \
            --output vendor/jre/${{ matrix.os }}

      # Build crate (it will use the vendored files automatically)
      - name: cargo build
        env:
          JAVA_HOME: ${{ github.workspace }}/vendor/jre/${{ matrix.os }}
        run: cargo build --release --target ${{ matrix.target }} --features cli

      # Run integration test (parse sample.pdf)
      - name: Test end‑to‑end
        env:
          JAVA_HOME: ${{ github.workspace }}/vendor/jre/${{ matrix.os }}
        run: cargo test --target ${{ matrix.target }}