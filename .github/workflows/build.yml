name: build

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GROBID_VERSION: '0.8.2'
  CARGO_PROFILE_RELEASE_DEBUG: "false"

# ------------------------------------------------------------------
#  Re-usable shell snippets (macOS/Linux use Bash; Windows use pwsh)
# ------------------------------------------------------------------
defaults:
  run:
    shell: bash
    # GitHub's runners already have zstd on Linux; brew install is ~1 s
    # Windows helper is handled in step.

jobs:
  # Check if source files have changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/**'

  # Fast syntactic & lint checks – always run
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy, rustfmt

      # Install cargo-chef for dependency caching
      - name: Install cargo-chef
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef

      # Generate recipe file (this rarely changes)
      - name: Generate recipe
        run: cargo chef prepare --recipe-path recipe.json

      # Build dependencies using recipe (cached across runs)
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-lint-chef-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-lint-chef-

      # Cook dependencies (using cache if available)
      - name: Build dependencies
        run: cargo chef cook --recipe-path recipe.json

      # Fallback cache for remaining dependencies
      - uses: Swatinem/rust-cache@v2    # handles registry/git/target
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ runner.os }}-rust-1.87.0-${{ hashFiles('**/Cargo.lock') }}

      # Format code (auto-fixes issues instead of just checking)
      - run: cargo fmt --all
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --workspace

  # Full build & test (matrix) – push only
  build:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.src == 'true'
    strategy:
      fail-fast: false         # don't cancel other OSes if one fails
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: ${{ matrix.target }}

      # Install cargo-chef for dependency caching
      - name: Install cargo-chef
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef

      # Generate recipe file (this rarely changes)
      - name: Generate recipe
        run: cargo chef prepare --recipe-path recipe.json

      # Build dependencies using recipe (cached across runs)
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            target/${{ matrix.target }}
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-chef-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-chef-

      # Cook dependencies (using cache if available)
      - name: Build dependencies
        run: cargo chef cook --release --target ${{ matrix.target }} --recipe-path recipe.json --features cli

      # Fallback cache for remaining dependencies
      - uses: Swatinem/rust-cache@v2
        with:
          target-dir: target/${{ matrix.target }}
          key: ${{ runner.os }}-${{ matrix.target }}-rust-1.87.0-${{ hashFiles('**/Cargo.lock') }}

      # Optional: speed-up incremental builds / LLVM linking
      - uses: mozilla-actions/sccache-action@v0.0.8
        env:
          SCCACHE_GHA_ENABLED: "true"

      # Install faster linkers
      - name: Install mold (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mold
        
      - name: Use mold linker (Linux)
        if: runner.os == 'Linux'
        run: echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> $GITHUB_ENV
        
      - name: Use lld linker (macOS)
        if: runner.os == 'macOS'
        run: echo 'RUSTFLAGS=-C link-arg=-fuse-ld=lld' >> $GITHUB_ENV

      # JDK needed for build.rs compilation but we use vendored JRE for runtime
      - uses: actions/setup-java@v3
        with: 
          distribution: temurin
          java-version: '11'
          
      # Prepare vendor directory for JRE/Grobid
      - name: Create vendor directories (Unix)
        if: runner.os != 'Windows'
        run: mkdir -p vendor/grobid
      
      - name: Create vendor directories (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path vendor)) { New-Item -Path vendor -ItemType Directory }
          if (-not (Test-Path vendor/grobid)) { New-Item -Path vendor/grobid -ItemType Directory }

      # Cache Grobid artifacts
      - name: Cache Grobid artifacts
        id: grobid-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/grobid
            vendor/runtime
          # key on Grobid version + OS; bump when you upgrade Grobid
          key: grobid-${{ env.GROBID_VERSION }}-${{ matrix.os }}

      # Configure build.rs behavior based on cache status
      - name: Configure Grobid build strategy
        if: steps.grobid-cache.outputs.cache-hit != 'true'
        run: |
          # Only set FORCE_GROBID_REBUILD if we don't have vendored files
          # This lets build.rs use vendored files if available instead of downloading
          if [ ! -d "vendor/grobid" ] || [ ! "$(ls -A vendor/grobid)" ]; then
            echo "FORCE_GROBID_REBUILD=true" >> "$GITHUB_ENV"
            echo "Using FORCE_GROBID_REBUILD because vendored files not found"
          else
            echo "Using vendored files without forced rebuild"
          fi

      # Install zstd for decompression (needed for .zst files)
      - name: Install zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd
        
      - name: Install zstd (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zstd
        
      # Windows: add zstd to PATH
      - if: runner.os == 'Windows'
        name: Install zstd
        shell: pwsh
        run: |
          iwr https://github.com/facebook/zstd/releases/download/v1.5.5/zstd-v1.5.5-win64.zip -Out z.zip
          Expand-Archive z.zip -DestinationPath $env:TEMP\zstd
          echo "$env:TEMP\zstd\zstd-v1.5.5-win64" | Out-File -Append -FilePath $env:GITHUB_PATH

      # ----------------------------------------------------------
      #  Build → unit tests → integration tests (fast-fail order)
      # ----------------------------------------------------------
      - name: Build (release) (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -j $(nproc) --target ${{ matrix.target }} --features cli
        
      - name: Build (release) (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked -j $(sysctl -n hw.ncpu) --target ${{ matrix.target }} --features cli
        
      - name: Build (release) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked -j $env:NUMBER_OF_PROCESSORS --target ${{ matrix.target }} --features cli

      # Install nextest for faster test runs
      - uses: taiki-e/install-action@nextest
      
      # Run tests with nextest (much faster than standard cargo test)
      - name: Unit + integration tests (Linux)
        if: runner.os == 'Linux'
        run: cargo nextest run --release -j $(nproc) --target ${{ matrix.target }}
        
      - name: Unit + integration tests (macOS)
        if: runner.os == 'macOS'
        run: cargo nextest run --release -j $(sysctl -n hw.ncpu) --target ${{ matrix.target }}
        
      - name: Unit + integration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo nextest run --release -j $env:NUMBER_OF_PROCESSORS --target ${{ matrix.target }}